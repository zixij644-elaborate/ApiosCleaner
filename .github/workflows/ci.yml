name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # 质量门禁：fmt / clippy / test（macOS 主平台）
  quality:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --all

  # 跨平台类型检查：核心引擎必须能在非 macOS 目标上编译
  # （适配层落地后 macOS 专属代码不得进入 Linux/Windows 构建）
  cross-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: [x86_64-unknown-linux-gnu, x86_64-pc-windows-gnu]
      - uses: Swatinem/rust-cache@v2
      - name: check (Linux target)
        run: cargo check --workspace --target x86_64-unknown-linux-gnu
      - name: check (Windows target)
        run: cargo check --workspace --target x86_64-pc-windows-gnu

  # Windows 原生测试：纯逻辑单测 + 平台专属单测（注册表/回收站/路径安全）
  # 在 windows-latest 真实运行（lipo 随 cfg(macos) 不编译；linux 行为不受影响）。
  # push 到 main 时额外产出 release 二进制 artifact —— 用户 Windows 本机直接下载。
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: test (Windows native)
        run: cargo test --all
      - name: build (release)
        if: github.event_name == 'push'
        run: cargo build --release --locked
      - name: upload artifact (Windows x86_64)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: apios-windows-x86_64
          path: target/release/apios.exe
          if-no-files-found: error
