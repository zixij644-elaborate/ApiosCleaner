name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # 质量门禁：fmt / clippy / test（macOS 主平台）
  # push 到 main 时额外产出 macOS 双架构 release 二进制（arm64 + x86_64，
  # 各一个单架构 zip —— 发布物无死重切片，也不可被 lipo 瘦身；替代手动
  # lipo 合并流程，2026-08-15 用户决策）
  quality:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --all
      - name: build (release, arm64)
        if: github.event_name == 'push'
        run: cargo build --release --target aarch64-apple-darwin --locked
      - name: build (release, x86_64)
        if: github.event_name == 'push'
        run: cargo build --release --target x86_64-apple-darwin --locked
      - name: package macOS zips
        if: github.event_name == 'push'
        run: |
          mkdir -p dist
          zip -j dist/apios-macos-arm64.zip target/aarch64-apple-darwin/release/apios
          zip -j dist/apios-macos-x86_64.zip target/x86_64-apple-darwin/release/apios
      - name: upload artifact (macOS arm64)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: apios-macos-arm64
          path: dist/apios-macos-arm64.zip
          if-no-files-found: error
      - name: upload artifact (macOS x86_64)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: apios-macos-x86_64
          path: dist/apios-macos-x86_64.zip
          if-no-files-found: error

  # Linux 原生测试：apt 解析 / XDG trash / .desktop 发现 / dev-env 表的真实运行。
  # cross-check 只编译不运行 —— Linux 逻辑必须 native 验证（Windows job 不跑
  # clippy 曾丢代码的教训）。push 到 main 时额外产出 release 二进制 artifact：
  # x86_64（gnu 原生）+ aarch64（musl 静态交叉 —— 纯 Rust 无 C 依赖，
  # rust-lld 静态链接，Kali 等 arm64 设备免 VM 内编译；2026-08-15 用户决策）。
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test (Linux native)
        run: cargo test --all
      - name: build (release, x86_64)
        if: github.event_name == 'push'
        run: cargo build --release --locked
      - name: build (release, aarch64 musl)
        if: github.event_name == 'push'
        run: |
          rustup target add aarch64-unknown-linux-musl
          # rustc 内置 lld —— 无需独立 rust-lld 组件（Linux 工具链无此组件）
          RUSTFLAGS="-C linker=rust-lld" cargo build --release --target aarch64-unknown-linux-musl --locked
      - name: upload artifact (Linux x86_64)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: apios-linux-x86_64
          path: target/release/apios
          if-no-files-found: error
      - name: upload artifact (Linux aarch64)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: apios-linux-aarch64
          path: target/aarch64-unknown-linux-musl/release/apios
          if-no-files-found: error

  # 跨平台类型检查：核心引擎必须能在非 macOS 目标上编译
  # （适配层落地后 macOS 专属代码不得进入 Windows 构建）。
  # Linux 的 native 编译/测试已由 linux job 覆盖，此处只保留 Windows target。
  cross-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - name: check (Windows target)
        run: cargo check --workspace --target x86_64-pc-windows-gnu

  # Windows 原生测试：纯逻辑单测 + 平台专属单测（注册表/回收站/路径安全）
  # 在 windows-latest 真实运行（lipo 随 cfg(macos) 不编译；linux 行为不受影响）。
  # push 到 main 时额外产出 release 二进制 artifact —— 用户 Windows 本机直接下载。
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: test (Windows native)
        run: cargo test --all
      - name: build (release)
        if: github.event_name == 'push'
        run: cargo build --release --locked
      - name: upload artifact (Windows x86_64)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: apios-windows-x86_64
          path: target/release/apios.exe
          if-no-files-found: error
